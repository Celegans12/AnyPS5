name: Upstream PR

on:
  push:
    branches: [yotei/best]
    paths: ['.github/upstream-prs/**', '.github/workflows/upstream-pr.yml']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-pr
  cancel-in-progress: false

jobs:
  open:
    if: github.repository == 'Celegans12/AnyPS5-Ghost-of-Yotei'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN }}
      UPSTREAM: boykopovar/AnyPS5
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - name: Open a pull request for every queued branch
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "::notice::UPSTREAM_PR_TOKEN secret is not set, nothing opened"; exit 0; fi
          shopt -s nullglob
          for f in .github/upstream-prs/*.md; do
            branch=$(basename "$f" .md | sed 's#__#/#g')
            if ! gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --silent 2>/dev/null; then
              echo "::warning::$branch is not on $GITHUB_REPOSITORY, skipped"; continue
            fi
            existing=$(gh api "repos/$UPSTREAM/pulls?head=$OWNER:$branch&state=all" --jq '.[0].html_url // empty')
            if [ -n "$existing" ]; then echo "$branch already has $existing"; continue; fi
            title=$(gh api "repos/$GITHUB_REPOSITORY/commits/$branch" --jq '.commit.message' | head -n1)
            url=$(gh api "repos/$UPSTREAM/pulls" -f title="$title" -f head="$OWNER:$branch" -f base=main -F maintainer_can_modify=true -F body=@"$f" --jq .html_url)
            echo "$branch -> $url" | tee -a "$GITHUB_STEP_SUMMARY"
          done
